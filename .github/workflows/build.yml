name: Build Fenrir Link

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.FENRIR_LINK_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fenrir-link.jks"
      - name: Build and sign the APK
        working-directory: android
        env:
          FENRIR_LINK_KEYSTORE: ${{ runner.temp }}/fenrir-link.jks
          FENRIR_LINK_KEYSTORE_PASSWORD: ${{ secrets.FENRIR_LINK_KEYSTORE_PASSWORD }}
          FENRIR_LINK_KEY_ALIAS: fenrirlink
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk FenrirLink.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FenrirLink-android
          path: FenrirLink.apk

  ios:
    name: iPhone (IPA, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/ios-setup.sh
      - name: Build the app without signing (sideloading signs it with the owner's Apple ID)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=1 build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry FenrirLink.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FenrirLink-ios
          path: FenrirLink.ipa

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/FenrirLink.apk out/FenrirLink.ipa --repo "$GITHUB_REPOSITORY" \
            --title "Fenrir Link" --notes "FenrirLink.apk for Android 8 and later. FenrirLink.ipa for iPhone, installed with AltStore or Sideloadly."
